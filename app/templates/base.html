<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }} - Belajar Kriptografi Klasik{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ site_description }}{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}kriptografi klasik, kalkulator kriptografi, enkripsi, dekripsi{% endblock %}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{ site_url }}{{ request.path }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{% block og_title %}{{ site_name }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ site_description }}{% endblock %}">
    <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='img/logo-cipherlab.svg') }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ site_name }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ site_description }}{% endblock %}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-cipherlab.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand nav-brand" href="/" aria-label="Beranda Kriptografi Klasik">
          <img class="brand-logo" src="{{ url_for('static', filename='img/logo-cipherlab.svg') }}" alt="" aria-hidden="true">
          <span class="brand-text">Kriptografi Klasik</span>
        </a>
        <div class="d-flex">
          <a class="nav-link text-light" href="/kalkulator">Kalkulator</a>
          <a class="nav-link text-light" href="/history">History</a>
          <button id="theme-toggle" class="btn btn-sm btn-outline-light ms-2">Toggle Theme</button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
